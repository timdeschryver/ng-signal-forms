name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request: {}

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: 📖 Check out repo
        uses: actions/checkout@v3
      - name: ⚙️ Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: 🔎 Install dependencies
        run: npm i --force # todo: this should be npm ci
      - name: ⚒️ Build
        run: npm run build
      # - name: 👀 Lint
      #   run: npm run lint
      # - name: 🧪 Test
      #   run: npm run test:coverage

  release:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # to push the release tag and create the GitHub release
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # to publish to npm via trusted publishing (OIDC), no NPM_TOKEN needed
    steps:
      - name: 📖 Check out repo
        uses: actions/checkout@v3
      - name: ⚙️ Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: 🔎 Install dependencies
        run: npm i --force # todo: this should be npm ci
      - name: ⚒️ Build
        run: npm run build
      - name: 🚀 Release
        if: github.repository == 'timdeschryver/ng-signal-forms' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true